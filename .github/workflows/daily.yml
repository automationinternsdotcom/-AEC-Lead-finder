name: daily-leads

on:
  # Schedule enabled Mon 5/25 per build sequence §13. Until then, manual only.
  # schedule:
  #   - cron: '0 14 * * *'  # 07:00 Arizona (UTC-7 year-round, AZ has no DST)
  workflow_dispatch:

# `contents: read` is enough — db.sqlite state lives in actions/cache, not git.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # State persistence. Unique key per run so save always happens; restore-keys
      # falls back to the most recent prior cache. GH Actions cache has a 7-day
      # idle TTL — if the pipeline doesn't run for > 7 days, state is lost and
      # the pipeline rediscovers URLs from scratch. For longer pauses or
      # cross-fork persistence, migrate to S3 / Turso / Supabase.
      - name: Restore db.sqlite from cache
        uses: actions/cache@v4
        with:
          path: db.sqlite
          key: db-sqlite-${{ github.run_id }}
          restore-keys: |
            db-sqlite-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PIPEDRIVE_DOMAIN: ${{ secrets.PIPEDRIVE_DOMAIN }}
          PIPEDRIVE_PIPELINE_ID: ${{ secrets.PIPEDRIVE_PIPELINE_ID }}
          PIPEDRIVE_STAGE_ID: ${{ secrets.PIPEDRIVE_STAGE_ID }}
        run: uv run python main.py
