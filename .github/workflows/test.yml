name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (incl. dev group)
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Run Scout self-check suite
        run: ./check.sh
