# Lead discovery sources. Two strategies in use:
#
#   method: rss          → direct publication feed (high precision, narrow set)
#   method: google_news  → Google News search-as-RSS (broad recall, mixed quality)
#                          endpoint is the search query, e.g. "Arizona commercial real estate when:30d"
#                          fetch.py builds the actual URL via build_google_news_url()
#
# All entries start disabled — flip enabled:true once verified by scripts/audit_sources.py.

# ──── Google News search RSS (ported from archived legacy feed script) ────

- name: google_news_az_cre
  method: google_news
  endpoint: "Arizona commercial real estate when:30d"
  enabled: true

- name: google_news_phoenix_dev
  method: google_news
  endpoint: "Phoenix office industrial retail development when:30d"
  enabled: true

- name: google_news_tucson_cre
  method: google_news
  endpoint: "Tucson commercial real estate development when:30d"
  enabled: true

