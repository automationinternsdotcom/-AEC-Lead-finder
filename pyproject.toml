[project]
name = "aether-leads"
version = "0.1.0"
description = "Daily AZ commercial real-estate lead pipeline"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "certifi>=2024.0",
    "dnspython>=2.6",
    "googlenewsdecoder>=0.1.7",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
