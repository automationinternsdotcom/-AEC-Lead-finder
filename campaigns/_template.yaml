# CampaignSpec authoring template.
#
# This file uses the human-authored Phase 1 YAML shape. The loader upconverts it
# to CampaignSpecV2 internally for run-state, discovery, pattern, and preview
# tooling. Keep the values valid so this template always passes validate-spec.

# Unique run/campaign identifier used in artifact folders and reports.
campaign_id: example-campaign

client:
  # Client or company name shown in prompts and reports.
  name: Example Client
  # Plain-English business context for the campaign operator and LLM prompts.
  company_description: >-
    Example Client sells a specific B2B service to a clearly defined customer
    profile. Replace this with the client's real positioning, geography, and
    buyer context before running the campaign.
  # Human-readable service areas; machine-filterable codes live under discovery.
  service_area:
    - Example metro area

targeting:
  # Industry or ICP label used in discovery and qualification prompts.
  industry: example B2B service category
  # Public signals that indicate a possible buying moment.
  trigger_signals:
    - example trigger signal
  # Job titles or roles that can influence the buying decision.
  buyer_personas:
    - Owner
    - Operations Manager
  # Terms that should bias the campaign away from irrelevant records.
  negative_keywords:
    - irrelevant example

discovery:
  # Discovery provider. Use gemini_api for automated Gemini source discovery,
  # deterministic for static sources/search_queries, or manual for human runs.
  provider: gemini_api
  # Shared template under prompts/<name>.md. Campaign-specific substance belongs
  # in client_prompt below.
  prompt_template: gemini_discovery
  # Daily candidate URL cap for this campaign.
  max_sources: 100
  # Source URL classes this campaign accepts from discovery.
  allowed_url_types:
    - article
    - rss_feed
    - atom_feed
    - sitemap
    - source_listing
    - permit_listing
    - market_report
  # Campaign/vertical-scoped dedupe. Change namespace per vertical/client.
  dedupe:
    scope: campaign
    namespace: example-campaign
    final_article_url_unique: true
  # Gemini API settings. Keep API keys in env/secrets, never in this file.
  gemini:
    model: gemini-3.1-pro-preview
    use_google_search: true
    temperature: 0.1
  # Client/vertical-specific discovery instructions. This is where the unique
  # prompt for each product vertical belongs.
  client_prompt: |-
    You are a B2B lead discovery assistant. Find source URLs that contain
    campaign-relevant buying signals for Example Client in the target geography.
    Replace this block with the tested vertical-specific discovery prompt.
  # Search queries Gemini/static discovery can use to find candidate sources.
  search_queries:
    - example industry trigger signal in target geography
  # Optional source registry tags from sources.yaml; leave empty if none apply.
  source_tags: []
  # Machine-filterable geography codes or labels.
  geography:
    - EX

qualification:
  # Start from prompts/generic_b2b_qualification_rubric.md, then add only the
  # vertical-specific examples and constraints here.
  # The keep/drop rubric applied after article/entity extraction.
  relevance_rubric: |-
    Use the generic B2B qualification rubric.

    HIGH: The record clearly matches the target signal and geography.
    MEDIUM: The record may match but needs human review or has weaker timing.
    LOW: The record is generic, out of geography, or lacks a buying signal.
  # Minimum model confidence accepted by discovery and qualification gates.
  min_confidence: 0.6

enrichment:
  # Persona guidance for contact enrichment.
  buyer_persona: Owner or Operations Manager with buying authority.
  # Outreach framing used in enrichment context and delivery notes.
  outreach_angle: >-
    Use a direct business-value angle tied to the trigger signal and the
    client's service, without inventing unverified claims.
  # Fields required before a lead is considered enriched.
  required_fields:
    - contact_name
    - contact_title
    - email_or_phone
    - company

destination:
  # Use excel in templates to stay credential-free and validation-safe.
  type: excel
  # Always keep Excel as the fallback preview destination.
  fallback: excel

schedule:
  # Use manual for templates; live campaigns may choose nightly or weekly.
  cadence: manual
  # Human preview remains required before any live destination write.
  preview_before_push: true
  # Safe first-batch cap for any future live delivery.
  max_first_push: 2
