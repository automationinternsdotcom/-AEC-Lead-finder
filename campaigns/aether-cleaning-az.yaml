# Cleaning vertical spec for the current Gemini API discovery-first flow.
# Campaign-specific discovery instructions, qualification rubric, allowed URL
# types, Gemini settings, and dedupe namespace live here so future verticals can
# be added by config instead of pipeline rewrites.

campaign_id: aether-cleaning-az

client:
  name: Aether Facility Services
  company_description: >-
    Aether Facility Services (Jordan Whitehurst) sells commercial cleaning +
    facility services in Arizona. The ICP is locally-owned 20-600 unit
    multifamily properties, plus commercial properties with active operations.
    Sales cycle is long (1-2 years from first contact to contract), so
    early-stage leads (land acquisition, construction starts) are still
    valuable.
  service_area:
    - Arizona
    - Goodyear to Apache Junction corridor
    - Tucson

targeting:
  industry: commercial cleaning / janitorial / facility services
  trigger_signals:
    - new tenant occupancy or lease signing at a commercial property
    - renovation, redevelopment, adaptive reuse, or construction completion
    - new business openings (restaurant, bar, coffee shop, dispensary, retail)
    - property management company changes or transitions
    - major expansion or buildout
    - new apartment / condo towers reaching lease-up phase
    - HOA stand-ups for new communities
    - developer land acquisitions
    - industrial / warehouse deals
  buyer_personas:
    - Owner
    - Chairman
    - CEO
    - Principal
    - COO
    - VP/Director of Facilities
    - Asset Manager
    - Investment Manager
    - Operations Manager
    - Property Manager
    - Developer
    - GC project manager
    - HOA board
  negative_keywords:
    - residential
    - single-family
    - homebuyer
    - mortgage rate
    - market commentary
    - rankings
    - awards

discovery:
  provider: gemini_api
  prompt_template: gemini_discovery
  max_sources: 100
  allowed_url_types:
    - article
    - rss_feed
    - atom_feed
    - sitemap
    - source_listing
    - permit_listing
    - market_report
  dedupe:
    scope: campaign
    namespace: aether-cleaning-az
    final_article_url_unique: true
  gemini:
    model: gemini-3.1-pro-preview
    use_google_search: true
    temperature: 0.1
  client_prompt: |-
    You are a B2B lead discovery assistant. Your job is to find source URLs that contain signals relevant to a specific campaign.

    CAMPAIGN CONTEXT:
    - Client: Commercial cleaning company serving new construction and commercial buildings.
    - Service area: Arizona, specifically the Phoenix metro area.
    - Target signal: Companies or projects that will need commercial cleaning services within the next 3 to 12 months.
    - Buyer personas: Facilities managers, property managers, developers, general contractor project managers.
    - Negative keywords: residential, DIY, for sale by owner, single family home.

    YOUR TASK:
    Find source URLs that are likely to contain articles, announcements, feeds, permit listings, reports, or updates about:
    - New commercial construction breaking ground or completing in Arizona.
    - Commercial building permits issued in the Phoenix metro area.
    - New office, retail, industrial, data center, semiconductor, logistics, or mixed-use developments in Arizona.
    - Commercial tenant improvement projects in Arizona.
    - Real estate development announcements in Phoenix, Scottsdale, Tempe, Mesa, Chandler, Gilbert, Glendale, Goodyear, and Surprise.
    - Commercial property completions, openings, ribbon cuttings, expansions, relocations, or lease-up activity in Arizona.
    - Corporate relocations and expansions into the Phoenix metro.
    - New data centers, semiconductor fabs, logistics facilities, industrial parks, office campuses, retail centers, and mixed-use projects being built in Arizona.

    STRICT REQUIREMENTS:
    - Return URLs from at least 20 different domains.
    - Do not over-index on a single source.
    - Include a mix of local Arizona business journals and news outlets, Arizona commercial real estate publications, RSS or Atom feeds, city permit portals or development activity pages, general contractor and developer newsrooms, regional construction industry news sites, commercial real estate brokerage research pages, economic development sites, and chamber of commerce sites.
    - Each URL must be a real, publicly accessible page.
    - Do not return social media URLs.
    - Do not return login-required pages.
    - Do not return paywalled content.
    - Do not return residential real estate URLs.
    - Do not return generic homepages.
    - Return specific article URLs, RSS/Atom feed URLs, sitemap URLs, reusable source listing pages, permit listing pages, market report pages, or development activity pages.
    - Use source_type "article" only for one specific dated article, press release, announcement, or project page.
    - Use source_type "source_listing" for category pages, newsroom pages, project listing pages, report indexes, search/results pages, and other reusable pages that contain links to many current or future items.
    - Never label URLs ending in /news, /newsroom, /projects, /category/..., /commercial-real-estate, /construction, or /economic-development as "article".
    - Every URL must start with http or https.
    - Only include URLs with confidence above 0.7.

    Prioritize breadth across domains and source types over depth in any single publication.
  # Verbatim from sources.yaml google_news endpoints.
  search_queries:
    - Arizona commercial real estate when:30d
    - Phoenix office industrial retail development when:30d
    - Tucson commercial real estate development when:30d
  # Feed names from sources.yaml (enabled set).
  source_tags:
    - google_news_az_cre
    - google_news_phoenix_dev
    - google_news_tucson_cre
    - azbex
    - arizona_digital_free_press
  geography:
    - AZ

qualification:
  # Full-fidelity Jordan protocol. Keep the substance here, not in the prompt
  # template, so CampaignSpec remains the single source of truth for
  # vertical-specific qualification.
  relevance_rubric: |-
    #### Jordan's HIGH/MEDIUM/LOW filter

    **HIGH** - push to Pipedrive with priority emphasis:
    - New tenant occupancy or lease signing at a commercial property
    - Renovation, redevelopment, adaptive reuse, or construction completion
    - New business openings (restaurants, bars, coffee shops, cannabis dispensaries, retail)
    - Property management company changes or transitions
    - Major expansion or buildout (e.g. TSMC north Phoenix)
    - **New apartment / condo towers reaching lease-up phase** (this is the ICP sweet spot)
    - HOA stand-ups for new communities

    **MEDIUM** - push to Pipedrive as routine leads:
    - Developer land acquisitions (lead is real but timeline is long)
    - Industrial / warehouse deals (opportunity exists but smaller value per deal)
    - General commercial property transactions without a clear physical-activity signal

    **LOW** - DO NOT push (these get filtered out downstream):
    - Macro market commentary, trend pieces, "state of the market" articles
    - Mortgage rate news, housing market opinions, editorials
    - Residential consumer coverage (homebuyers, single-family homes)
    - National stories that mention Arizona in passing
    - Rankings, awards, people-moves without property activity
    - Anything where the *property* is outside Arizona (set `az_relevant=false`)

    **Geographic scope:** Arizona only. The corridor Jordan actively works is **Goodyear east to Apache Junction, plus Tucson**. Penalize (don't reject, but rate down) anywhere else in AZ.
  min_confidence: 0.6

enrichment:
  buyer_persona: >-
    Owner, Chairman, CEO, Principal, COO, VP/Director of Facilities, Asset
    Manager, Investment Manager, Operations Manager, Property Manager, developer,
    GC project manager, or HOA board member with buying authority or influence
    for facility-services contracts.
  # Aether "Straight Shooter" voice: asset preservation / strategic partner,
  # NOT "cleaning" or "janitor" (schema.py + push.py enforce this framing).
  outreach_angle: >-
    Brand voice - "Straight Shooter": direct, asset-minded, ROI/NOI-focused.
    Frame the value as "asset preservation" and "strategic partner", NOT
    "cleaning" or "janitor".
  required_fields:
    - contact_name
    - contact_title
    - email_or_phone
    - company

destination:
  type: pipedrive
  pipedrive:
    api_key_ref: secret://campaigns/aether-cleaning-az/pipedrive
    field_mapping: standard
  fallback: excel

schedule:
  cadence: nightly
  preview_before_push: true
  max_first_push: 2
